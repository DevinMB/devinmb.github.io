<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8fa382">
{% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <nav class="site-nav" role="navigation">
      <a class="brand" href="{{ '/' | relative_url }}">Devin Butts</a>
      <div class="nav-links">
        <a href="{{ '/projects.html' | relative_url }}"{% if page.url contains 'projects' %} class="active"{% endif %}>Projects</a>
        <a href="{{ '/about-me.html' | relative_url }}"{% if page.url contains 'about' %} class="active"{% endif %}>About</a>
      </div>
    </nav>

    <main id="content" class="page" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>&copy; {{ site.time | date: '%Y' }} Devin Butts</span>
      <span><a href="https://github.com/DevinMB">GitHub</a> &middot; <a href="https://www.linkedin.com/in/devinmb/">LinkedIn</a></span>
    </footer>
  </body>
</html>
